<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <style>
@keyframes vk-anim-waste-food-scraps {
  0%, 100% { transform: translateY(0px) scale(1, 1); }
  15% { transform: translateY(5px) scale(1.12, 0.88); }
  50% { transform: translateY(-36px) scale(0.88, 1.12); }
  85% { transform: translateY(0px) scale(1.04, 0.96); }
}
.vk-anim-waste-food-scraps { animation: vk-anim-waste-food-scraps 2.1s ease-in-out 0.15s infinite normal; transform-origin: 0px 0px;  }
  </style>
  <g transform="translate(400, 270) rotate(-18)">
    <g class="vk-anim-waste-food-scraps">
      <g transform="scale(0.72)">
        <!-- Stem & Green Leaf -->
        <path d="M 0 -64 C 4 -82, 14 -92, 22 -90" fill="none" stroke="#1E1E1E" stroke-width="3.92" stroke-linecap="round" />
        <path d="M 4 -76 C 24 -92, 54 -84, 48 -62 C 36 -50, 14 -58, 4 -76 Z" fill="#8AD859" stroke="#1E1E1E" stroke-width="2.38" />
        <!-- Bitten Apple Core Flesh (Warm Cream / Yellow) -->
        <path d="M -42 -42 L 42 -42 C 18 -16, 18 24, 44 52 L -44 52 C -18 24, -18 -16, -42 -42 Z" fill="#FEF9C3" stroke="#1E1E1E" stroke-width="2.8" stroke-linejoin="round" />
        <!-- Top Apple Cap (Coral Red) -->
        <path d="M -52 -46 C -48 -72, -16 -74, 0 -60 C 16 -74, 48 -72, 52 -46 C 32 -36, -32 -36, -52 -46 Z" fill="#FF6B5B" stroke="#1E1E1E" stroke-width="2.8" stroke-linejoin="round" />
        <!-- Bottom Apple Base (Coral Red) -->
        <path d="M -50 48 C -28 38, 28 38, 50 48 C 46 76, 16 82, 0 70 C -16 82, -46 76, -50 48 Z" fill="#FF6B5B" stroke="#1E1E1E" stroke-width="2.8" stroke-linejoin="round" />
        <!-- Apple Seeds -->
        <ellipse cx="-6" cy="-2" rx="3.5" ry="6" transform="rotate(-15 -6 -2)" fill="#1E1E1E" />
        <ellipse cx="7" cy="6" rx="3.5" ry="6" transform="rotate(15 7 6)" fill="#1E1E1E" />
        <ellipse cx="-26" cy="-56" rx="10" ry="4" transform="rotate(-15 -26 -56)" fill="#FFFFFF" />
      </g>
    </g>
  </g>
</svg>