<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <style>
@keyframes art-bob {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(0px, -6px); }
}
@keyframes art-spin-rays {
  to { transform: rotate(360deg); }
}
.art-bob { animation: art-bob 2.2s ease-in-out 0s infinite normal; transform-origin: 0px 0px;  }
.art-rays { animation: art-spin-rays 24s linear 0s infinite normal; transform-box: fill-box; transform-origin: center; }
  </style>
  <g transform="translate(400, 270) rotate(0)">
    <g class="art-bob">
      <g transform="scale(0.76)">
        <circle class="art-rays" cx="0" cy="0" r="58" fill="none" stroke="#FB923C" stroke-width="14" stroke-dasharray="14 12" />
        <circle cx="0" cy="0" r="46" fill="#FDE047" stroke="#1E1E1E" stroke-width="2.8" />
        <g transform="translate(0, 2) scale(1)">
      <ellipse cx="-22" cy="8" rx="7" ry="4" fill="#FDA4AF" />
      <ellipse cx="22" cy="8" rx="7" ry="4" fill="#FDA4AF" />
      <rect x="-32" y="-12" width="28" height="16" rx="4" fill="#1E1E1E" />
      <rect x="4" y="-12" width="28" height="16" rx="4" fill="#1E1E1E" />
      <line x1="-4" y1="-6" x2="4" y2="-6" stroke="#1E1E1E" stroke-width="4" />
      <line x1="-26" y1="-8" x2="-16" y2="-8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="10" y1="-8" x2="20" y2="-8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -10 10 Q 0 20 10 10" fill="none" stroke="#1E1E1E" stroke-width="2.8" stroke-linecap="round" />
    </g>
      </g>
    </g>
  </g>
</svg>