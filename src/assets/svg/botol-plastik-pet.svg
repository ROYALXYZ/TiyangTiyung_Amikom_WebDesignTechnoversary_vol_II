<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <style>
@keyframes art-bob {
  0%, 100% { transform: scale(1, 1) rotate(0deg); }
  30% { transform: scale(1.16, 0.86) rotate(-3deg); }
  55% { transform: scale(0.89, 1.13) rotate(3deg); }
  75% { transform: scale(1.05, 0.96) rotate(-1deg); }
}
.art-bob { animation: art-bob 2.2s ease-in-out 0s infinite normal; transform-origin: 0px 0px;  }
  </style>
  <g transform="translate(400, 270) rotate(0)">
    <g class="art-bob">
      <g transform="scale(0.72)">
        <!-- Bottle Cap (Coral / Red) -->
        <rect x="-18" y="-92" width="36" height="18" rx="6" fill="#FF6B5B" stroke="#1E1E1E" stroke-width="2.8" />
        <!-- Crushed / Wavy Plastic Bottle Body -->
        <path d="M -14 -74 L 14 -74 L 42 -36 C 52 -20, 34 2, 46 22 C 56 42, 48 82, 32 88 L -34 88 C -50 82, -42 42, -32 20 C -22 -2, -48 -18, -38 -38 Z" fill="#60A5FA" stroke="#1E1E1E" stroke-width="2.8" stroke-linejoin="round" />
        <!-- Bottle Label Band -->
        <path d="M -38 -8 L 40 -2 L 36 28 L -34 22 Z" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2.38" stroke-linejoin="round" />
        <!-- Crinkle Crease Lines -->
        <path d="M -22 -42 L 18 -34 M -18 52 L 24 44 M -12 68 L 16 64" fill="none" stroke="#1E1E1E" stroke-width="2.52" stroke-linecap="round" />
        <ellipse cx="-22" cy="-24" rx="6" ry="14" transform="rotate(14 -22 -24)" fill="#FFFFFF" />
      </g>
    </g>
  </g>
</svg>